# ============================================================
#  OpenEvolve — TurboQuant-KV Configuration
#  Universal Adaptive Training Controller Evolution
# ============================================================

# --- General ---
max_iterations: 50
checkpoint_interval: 5
log_level: "INFO"
random_seed: 42
diff_based_evolution: true        # evolve via diffs, not full rewrites
max_code_length: 15000

# --- Early stopping ---
early_stopping_patience: 15       # stop if no improvement for 15 iterations
convergence_threshold: 0.005      # minimum delta to count as improvement
early_stopping_metric: "combined_score"

# --- LLM: Gemini 3.5 Flash (free tier — 1,500 req/day, 10 RPM) ---
# Set your key in Colab:  import os; os.environ["GEMINI_API_KEY"] = "AIza..."
llm:
  models:
    - name: "gemini-3.5-flash"     # best free-tier model for code (June 2026)
      weight: 0.8
    - name: "gemini-3.1-flash-lite" # fast fallback; 15 RPM on free tier
      weight: 0.2

  evaluator_models:
    - name: "gemini-3.1-flash-lite"
      weight: 1.0

  api_base: "https://generativelanguage.googleapis.com/v1beta/openai/"
  api_key: ${GEMINI_API_KEY}

  temperature: 0.8
  top_p: 0.95
  max_tokens: 8192
  timeout: 120
  retries: 3
  retry_delay: 8

# --- Prompt ---
prompt:
  system_message: >
    You are an expert ML engineer specialising in deep learning training optimisation.
    Your task is to improve the decide() method of a UniversalAdaptiveController.

    The controller manages five hyperparameters in real time:
      • learning rate (LR)
      • batch size
      • gradient checkpointing (on/off)
      • AMP / mixed-precision (on/off)
      • data pruning ratio (curriculum learning)

    The evaluation function scores each controller on FOUR metrics:
      1. loss_score     (50%) — did training converge? (initial → final loss drop)
      2. stability_score (20%) — is the final training phase smooth and stable?
                                 (low coefficient-of-variation in last 50 steps)
      3. speed_score    (15%) — throughput (faster step time = higher score)
      4. vram_score     (15%) — VRAM efficiency

    combined_score = 0.50×loss + 0.20×stability + 0.15×speed + 0.15×vram

    Each evolved program receives "artifacts" showing:
      - loss convergence info
      - stability CV value
      - batch size evolution (start → end, min, max)
    Use these to understand how the controller actually behaved.

    IMPORTANT: ONLY modify the code between EVOLVE-BLOCK-START and EVOLVE-BLOCK-END.
    Do NOT change any other part of the file.

  evaluator_system_message: "You are an expert code reviewer for ML training optimisation."

  num_top_programs: 3
  num_diverse_programs: 2
  use_template_stochasticity: true

  include_artifacts: true           # pass batch/loss/stability info to LLM
  max_artifact_bytes: 12288

# --- Database / Population ---
database:
  population_size: 100
  archive_size: 30
  num_islands: 3
  migration_interval: 10
  migration_rate: 0.1
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  exploration_ratio: 0.2
  feature_dimensions:
    - "complexity"
    - "diversity"
  feature_bins: 10

# --- Evaluator ---
evaluator:
  timeout: 300            # generous for GPU warm-up on T4 + 200-step run
  max_retries: 2
  cascade_evaluation: false
  parallel_evaluations: 1  # IMPORTANT: free tier = 10 RPM → keep at 1
  use_llm_feedback: false
