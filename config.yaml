# ============================================================
#  OpenEvolve — TurboQuant-KV Configuration
#  Universal Adaptive Training Controller Evolution
# ============================================================

# --- General ---
max_iterations: 50
checkpoint_interval: 5
log_level: "INFO"
random_seed: 42
diff_based_evolution: true        # evolve via diffs, not full rewrites
max_code_length: 15000

# --- Early stopping ---
early_stopping_patience: 15       # stop if no improvement for 15 iterations
convergence_threshold: 0.005      # minimum delta to count as improvement
early_stopping_metric: "combined_score"

# --- LLM (Qwen 2.5 Coder — local llama-cpp-python server on Colab) ---
# Setup required in Colab BEFORE running OpenEvolve:
#   1. pip install llama-cpp-python[server] (with CUDA support)
#   2. Download model GGUF from HuggingFace
#   3. Start server:  python -m llama_cpp.server --model /path/to/model.gguf \
#                         --host 0.0.0.0 --port 8000 --n_gpu_layers -1 &
# Recommended model size: 7B Q4_K_M (~4.5 GB VRAM, fits alongside evaluator on T4)
llm:
  models:
    - name: "qwen2.5-coder"        # Name ignored by llama-cpp-python; can be anything
      weight: 1.0

  evaluator_models:
    - name: "qwen2.5-coder"
      weight: 1.0

  api_base: "http://localhost:8000/v1"   # llama-cpp-python OpenAI-compat endpoint
  api_key: "local"                        # Required field; ignored by local server

  temperature: 0.8
  top_p: 0.95
  max_tokens: 4096                # Local models are slower; keep context moderate
  timeout: 300                    # Local inference is slower than cloud API
  retries: 3
  retry_delay: 10

# --- Prompt ---
prompt:
  system_message: >
    You are an expert ML engineer specialising in deep learning training optimisation.
    Your task is to improve the decide() method of a UniversalAdaptiveController.
    The controller manages five training hyperparameters in real time:
      • learning rate (LR)
      • batch size
      • gradient checkpointing (on/off)
      • AMP / mixed-precision (on/off)
      • data pruning ratio (curriculum learning)
    The current state of training is described by a ControllerState object
    (loss trends, memory pressure, step time, etc.).
    Your goal: maximise combined_score = 0.6 × loss_score + 0.2 × speed_score + 0.2 × vram_score.
    IMPORTANT: only modify code between the EVOLVE-BLOCK-START and EVOLVE-BLOCK-END markers.
    Do not change any other part of the file.

  evaluator_system_message: "You are an expert code reviewer for ML training optimisation code."

  num_top_programs: 3
  num_diverse_programs: 2
  use_template_stochasticity: true

  include_artifacts: true
  max_artifact_bytes: 10240

# --- Database / Population ---
database:
  population_size: 100
  archive_size: 30
  num_islands: 3
  migration_interval: 10
  migration_rate: 0.1
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  exploration_ratio: 0.2
  feature_dimensions:
    - "complexity"
    - "diversity"
  feature_bins: 10

# --- Evaluator ---
evaluator:
  timeout: 240          # seconds — generous for GPU warm-up on T4
  max_retries: 2
  cascade_evaluation: false
  parallel_evaluations: 2
  use_llm_feedback: false
