# ============================================================
#  OpenEvolve — TurboQuant-KV Configuration
#  Universal Adaptive Training Controller Evolution
# ============================================================

# --- General ---
max_iterations: 500              # 50 جيل × 10 عينة = 500 مرشح إجمالي
checkpoint_interval: 5
log_level: "INFO"
random_seed: 42
diff_based_evolution: true
max_code_length: 15000

# --- Early stopping ---
early_stopping_patience: 15
convergence_threshold: 0.005
early_stopping_metric: "combined_score"

# --- LLM: Gemini 3.5 Flash (free tier — 1,500 req/day, 10 RPM) ---
# Set your key in Colab Secrets with name: GEMINI_API_KEY
llm:
  models:
    - name: "gemini-3.5-flash"
      weight: 0.8
    - name: "gemini-3.1-flash-lite"
      weight: 0.2

  evaluator_models:
    - name: "gemini-3.1-flash-lite"
      weight: 1.0

  api_base: "https://generativelanguage.googleapis.com/v1beta/openai/"
  api_key: ${GEMINI_API_KEY}

  temperature: 0.8
  top_p: 0.95
  max_tokens: 8192
  timeout: 120
  retries: 3
  retry_delay: 8

# --- Prompt ---
prompt:
  system_message: >
    You are an expert ML engineer specialising in deep learning training optimisation.
    Your task is to improve the decide() method of a UniversalAdaptiveController.

    The controller manages five hyperparameters in real time:
      - learning rate (LR)
      - batch size
      - gradient checkpointing (on/off)
      - AMP / mixed-precision (on/off)
      - data pruning ratio (curriculum learning)

    The evaluation scores each controller on FOUR metrics:
      1. loss_score     (50%) — convergence: did training improve?
      2. stability_score (20%) — smoothness: low variance in last 50 steps?
      3. speed_score    (15%) — throughput: fast step time?
      4. vram_score     (15%) — memory: low peak VRAM?

    combined_score = 0.50 x loss + 0.20 x stability + 0.15 x speed + 0.15 x vram

    Each candidate also receives artifacts showing:
      - loss convergence (initial → final)
      - stability CV value
      - batch size evolution (start, end, min, max)
    Use these to understand how the controller actually behaved.

    IMPORTANT: ONLY modify code between EVOLVE-BLOCK-START and EVOLVE-BLOCK-END.
    Do NOT change any other part of the file.

  evaluator_system_message: "You are an expert code reviewer for ML training optimisation."

  num_top_programs: 3
  num_diverse_programs: 2
  use_template_stochasticity: true
  include_artifacts: true
  max_artifact_bytes: 12288

# --- Database ---
database:
  population_size: 100
  archive_size: 30
  num_islands: 3
  migration_interval: 10
  migration_rate: 0.1
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  exploration_ratio: 0.2
  feature_dimensions:
    - "complexity"
    - "diversity"
  feature_bins: 10

# --- Evaluator ---
evaluator:
  timeout: 300
  max_retries: 2
  cascade_evaluation: false
  parallel_evaluations: 1    # IMPORTANT: free tier = 10 RPM → keep at 1
  use_llm_feedback: false
